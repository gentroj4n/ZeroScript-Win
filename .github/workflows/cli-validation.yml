name: Validate ZeroScript CLI remaster

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  cli-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI dependencies
        run: python -m pip install websockets rich prompt_toolkit Pillow
      - name: Run CLI regression tests
        shell: pwsh
        run: |
          python -m unittest zeroscript_cli.test_agent zeroscript_cli.test_remaster_services zeroscript_cli.test_skills zeroscript_cli.test_hooks -v 2>&1 | Tee-Object -FilePath cli-test-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile CLI modules
        shell: pwsh
        run: |
          python -m compileall -q zeroscript_cli 2>&1 | Tee-Object -FilePath cli-compile-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload CLI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-validation-${{ github.run_id }}
          path: |
            cli-test-results.txt
            cli-compile-results.txt
          if-no-files-found: ignore
