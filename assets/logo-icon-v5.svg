<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GameboyEmu MAX">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2434"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="pixel5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4FBEE"/>
      <stop offset="0.55" stop-color="#5BD9C6"/>
      <stop offset="1" stop-color="#2FA593"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg5)"/>
  <rect x="92" y="76" width="328" height="264" rx="20" fill="#04070C" stroke="#222C3C" stroke-width="4"/>

  <!-- Pixel M, 5x5 grid, 48px blocks, flush. Origins: x0=136, y0=98 -->
  <g fill="url(#pixel5)">
    <rect x="136" y="98"  width="48" height="48"/>
    <rect x="328" y="98"  width="48" height="48"/>

    <rect x="136" y="146" width="48" height="48"/>
    <rect x="184" y="146" width="48" height="48"/>
    <rect x="280" y="146" width="48" height="48"/>
    <rect x="328" y="146" width="48" height="48"/>

    <rect x="136" y="194" width="48" height="48"/>
    <rect x="232" y="194" width="48" height="48"/>
    <rect x="328" y="194" width="48" height="48"/>

    <rect x="136" y="242" width="48" height="48"/>
    <rect x="328" y="242" width="48" height="48"/>

    <rect x="136" y="290" width="48" height="48"/>
    <rect x="328" y="290" width="48" height="48"/>
  </g>

  <text x="256" y="440" font-family="Montserrat, 'Segoe UI', Verdana, sans-serif" font-size="88" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#FF696E">MAX</text>
</svg>
