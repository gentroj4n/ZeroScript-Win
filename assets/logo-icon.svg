  <rect x="88" y="84" width="336" height="120" rx="28" fill="url(#gloss)"/>

  <path d="M 238 156 L 338 208 L 238 260 Z" fill="#0C111B"/>

  <rect x="88" y="364" width="336" height="68" rx="18" fill="#FF696E"/>
  <text x="256" y="410" font-family="Montserrat, 'Segoe UI', Verdana, sans-serif" font-size="40" font-weight="800" letter-spacing="8" text-anchor="middle" fill="#0C111B">MAX</text>
