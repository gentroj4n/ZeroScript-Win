<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GameboyEmu MAX">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2434"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="screen3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A2A"/>
      <stop offset="1" stop-color="#0A1A1C"/>
    </linearGradient>
    <linearGradient id="pixel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6F7E8"/>
      <stop offset="1" stop-color="#37B7A4"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg3)"/>

  <!-- Screen bezel -->
  <rect x="96" y="80" width="320" height="252" rx="22" fill="url(#screen3)" stroke="#2C3A4F" stroke-width="5"/>

  <!-- Pixel-art M (5x5), the wordmark mark -->
  <g fill="url(#pixel3)">
    <rect x="128" y="112" width="44" height="44"/>
    <rect x="340" y="112" width="44" height="44"/>

    <rect x="128" y="162" width="44" height="44"/>
    <rect x="178" y="162" width="44" height="44"/>
    <rect x="290" y="162" width="44" height="44"/>
    <rect x="340" y="162" width="44" height="44"/>

    <rect x="128" y="212" width="44" height="44"/>
    <rect x="234" y="212" width="44" height="44"/>
    <rect x="340" y="212" width="44" height="44"/>

    <rect x="128" y="262" width="44" height="44"/>
    <rect x="340" y="262" width="44" height="44"/>
  </g>

  <!-- Coral MAX wordmark -->
  <text x="256" y="432" font-family="Montserrat, 'Segoe UI', Verdana, sans-serif" font-size="86" font-weight="900" letter-spacing="2" text-anchor="middle" fill="#FF696E">MAX</text>
</svg>
