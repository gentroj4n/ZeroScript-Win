[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroscript-win-cli"
version = "1.16.0"
description = "Independent local CLI agent for ZeroScript-Win"
readme = "docs/CLI_AGENT.md"
requires-python = ">=3.9"
dependencies = ["websockets>=10.4", "rich>=13.7", "prompt_toolkit>=3.0.43"]

[project.optional-dependencies]
visual = ["Pillow>=10.0"]

[project.scripts]
zeroscript = "zeroscript_cli.agent:main"

[tool.setuptools]
packages = ["zeroscript_cli"]

[tool.setuptools.package-data]
zeroscript_cli = ["builtin_skills/**/*.md", "builtin_agents/**/*.md"]
